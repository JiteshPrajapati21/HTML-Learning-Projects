<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - HTML</title>
</head>

<body>
    <table>
        <!-- Head of table  -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <!-- Body of table -->
        <tbody>
            <tr>
                <td>Robert Downey</td>
                <td>Software developer</td>
                <td>$260K</td>
            </tr>
            <tr>
                <td>Jitesh Prajapati</td>
                <td>Data scientist</td>
                <td>$280K</td>
            </tr>
            <tr>
                <td>Jerry Maguire</td>
                <td>AI ML engineer</td>
                <td>$250K</td>
            </tr>
            <tr>
                <td>Elon Stark </td>
                <td>Cyber security</td>
                <td>$410K</td>
            </tr>
            <tr>
                <!-- Colspan=3 means it will take all 3 cloumn in the table -->
                <td colspan="3">Thankyou</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
